[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bom2kit"
version = "0.1.0"
description = "Traceable rectangular packing search and BOM-to-kit instructions"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
cad = ["cadquery>=2.5,<3"]
mesh = ["trimesh>=4.12,<5", "python-fcl>=0.7,<0.8", "rtree>=1.4,<2", "scipy>=1.14,<2"]
test = ["pytest>=8,<10"]
report = ["reportlab>=5,<6", "PyMuPDF>=1.26,<2", "matplotlib>=3.11,<4", "vtk>=9.3,<10"]

[project.scripts]
bom2kit = "bom2kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
